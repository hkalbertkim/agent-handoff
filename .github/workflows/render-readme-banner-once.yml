name: Render README banner (one-time)
on:
  push:
    branches: [docs/evergreen-readme-hero]
permissions:
  contents: write
jobs:
  banner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/evergreen-readme-hero
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install raster screenshot renderer
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Render actual PNG banner (no SVG)
        run: |
          mkdir -p demo
          node --input-type=module <<'NODE'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1600,height:620},deviceScaleFactor:1});
          await page.setContent(`<!doctype html><html><head><meta charset="utf-8"><style>
          *{box-sizing:border-box}html,body{margin:0;width:1600px;height:620px;overflow:hidden;font-family:Inter,Arial,Helvetica,sans-serif;color:#202846}
          body{background:radial-gradient(circle at 87% 7%,#ece8ff 0%,transparent 38%),radial-gradient(circle at 4% 94%,#ebf1ff 0%,transparent 36%),#fbfbff}
          .wrap{height:100%;padding:65px 86px;display:flex;gap:90px;align-items:center}
          .left{width:655px;flex:none}.eyebrow{font-size:15px;letter-spacing:3.5px;font-weight:800;color:#6f75aa}
          h1{font-size:69px;line-height:1.10;letter-spacing:-3.9px;margin:25px 0 24px;font-weight:800}
          h1 span{color:#6f69d7}
          p{font-size:22px;color:#7d839f;line-height:1.5;margin:0;max-width:590px}
          .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:33px}
          .chip{padding:11px 17px;border-radius:80px;background:#eeefff;color:#6865b3;font-size:15px;font-weight:750;border:1px solid #e4e5fa}
          .right{flex:1;min-width:0;position:relative}
          .card{background:white;border:1px solid #e5e7f5;border-radius:28px;box-shadow:0 30px 75px rgba(63,70,126,.14);padding:30px}
          .label{font-size:13px;color:#8c91a9;letter-spacing:2px;font-weight:800}
          .task{font-size:24px;font-weight:800;margin:9px 0 12px}
          .constraint{font-size:14px;color:#37846f;background:#edf9f3;border:1px solid #dbeee5;border-radius:11px;padding:12px 14px}
          .two{display:grid;grid-template-columns:1fr 44px 1fr;gap:10px;align-items:center;margin-top:24px}
          .person{border:1px solid #e9eaf8;background:#fafaff;border-radius:17px;padding:16px}
          .person.active{border:2px solid #aaa5f4;background:#f5f3ff}
          .avatar{display:inline-flex;width:33px;height:33px;border-radius:10px;background:#e6e3ff;color:#675fd9;align-items:center;justify-content:center;font-size:16px;font-weight:900;vertical-align:middle;margin-right:7px}
          .name{font-size:17px;font-weight:800;white-space:nowrap}
          .role{font-size:13px;color:#8c92ab;margin-top:11px;padding-left:2px}
          .role.active{color:#6e62d5;font-weight:800}
          .arrow{text-align:center;color:#756fe3;font-size:32px;font-weight:900}
          .verified{margin-top:24px;display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eef0f7;padding-top:18px;font-weight:750;color:#65718c;font-size:15px}
          .good{color:#28846c;background:#eaf9f1;padding:9px 13px;border-radius:9px}
          </style></head><body><div class="wrap"><div class="left"><div class="eyebrow">AGENT HANDOFF</div><h1>One task.<br><span>Two people.</span><br>One clear handoff.</h1><p>Shared progress. Explicit control.<br>Original constraints preserved.</p><div class="chips"><div class="chip">Live sync</div><div class="chip">Controlled handoff</div><div class="chip">Verified results</div></div></div><div class="right"><div class="card"><div class="label">SHARED TASK SESSION</div><div class="task">Fix login edge-case</div><div class="constraint">✓ &nbsp;Authentication must remain enabled</div><div class="two"><div class="person"><div class="name"><span class="avatar">A</span>Developer A</div><div class="role">Observer</div></div><div class="arrow">→</div><div class="person active"><div class="name"><span class="avatar">B</span>Developer B</div><div class="role active">Controller</div></div></div><div class="verified"><span>Control transferred · A → B</span><span class="good">✓ &nbsp;3/3 PASS</span></div></div></div></div></body></html>`);
          await page.screenshot({path:'demo/hero.png',type:'png'});
          await browser.close();
          NODE
          file demo/hero.png
          test "$(stat -c %s demo/hero.png)" -lt 3000000
      - name: Save README hero image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/hero.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add raster hero banner to README"
            git push origin HEAD:docs/evergreen-readme-hero
          fi
