name: Publish README real-browser GIF (one-time)
on:
  push:
    branches: [docs/readme-real-two-browser-gif]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/readme-real-two-browser-gif
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Capture actual Developer A and B sessions
        run: node tests/browser-smoke.mjs
      - name: Build optimized side-by-side GIF from real browser recordings
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          mkdir -p demo
          ffmpeg -y -i artifacts/developer-a-real-browser.webm -i artifacts/developer-b-real-browser.webm \
            -filter_complex "[0:v]fps=5,scale=600:-1:flags=lanczos,setsar=1[a];[1:v]fps=5,scale=600:-1:flags=lanczos,setsar=1[b];[a][b]hstack=inputs=2:shortest=1,split[v][p];[p]palettegen=max_colors=120:stats_mode=diff[pal];[v][pal]paletteuse=dither=bayer:bayer_scale=4" \
            -t 13.25 -loop 0 demo/agent-handoff-two-developers.gif
          test "$(stat -c %s demo/agent-handoff-two-developers.gif)" -lt 10000000
      - name: Commit GIF to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add demo/agent-handoff-two-developers.gif
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish real two-browser handoff GIF"
            git push origin HEAD:docs/readme-real-two-browser-gif
          fi
