name: Browser QC
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  chromium-e2e:
    name: Two-browser handoff
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright for isolated QC
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E two-browser scenario
        run: node tests/browser-smoke.mjs
      - name: Store screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: two-browser-evidence
          path: artifacts/*.png
          if-no-files-found: ignore
